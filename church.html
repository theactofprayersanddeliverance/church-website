<!--
=====================================================================================
 ARCHITECTURE GUIDE  (for a developer or AI converting this to React / Next.js
 and connecting a database)
=====================================================================================
 One HTML file. A small hash router shows ONE page (view) at a time. Every page has
 its own shimmer loading state, its own data fetch, and its own enter animation.

 SCRIPT SECTIONS (search for the numbered banners)
   1 SITE        church-wide settings (name, contact, logo)
   2 DB          mock data. Each key is a future database table.
   3 API         the ONLY place views read data from. Async, returns JSON.
                 Replace the bodies with fetch('/api/...') and nothing else changes.
   4 UTILS       helpers (escape, dates, next service)
   5 COMPONENTS  functions returning HTML strings (one React component each)
   6 VIEWS       one async function per page: returns { title, html, mount, unmount }
   7 ROUTER      skeleton -> data -> render -> mount lifecycle
   8 SHELL       header, mobile menu, footer, dialog, scroll effects

 ROUTES            view            React page
   #/              home            Home
   #/about         about           About (pastor, mission, beliefs)
   #/programs      programs        Programs (weekly services + events)
   #/live          live            Live (player, full screen, live chat) or "no live"
   #/videos        videos          Video archive (search, sort, filter, grid/list)
   #/video/:id     video           Video detail
   #/testimonies   testimonies     Testimonies (video cards + dialog)
   #/ministers     ministers       Ministers
   #/books         books           Books and resources
   #/give          give            Give
   #/contact       contact         Contact / plan a visit

 PAGE LIFECYCLE   leave animation -> view.skeleton() shimmer -> await view(params)
   -> swap html -> view.mount(el) -> scroll top -> reveal animations.
   view.unmount() runs on leave (stops chat, exits full screen, removes listeners).
   React equivalent: react-router + Suspense fallback + data loaders.

 ROUTER NOTE  The router keeps the current path in memory AND mirrors it to the URL
   hash inside try/catch, so it still works in sandboxed previews and iframes where
   the browser blocks history changes.

 DATABASE TABLES  (match the DB object)
   church       { name, short, address, phone, email, logoUrl }
   pastor       { name, title, bio[], photoUrl }
   services     { id, name, day(0-6), time("HH:MM"), venue }
   events       { id, title, date, time, venue, info }
   videos       { id, title, subject, speaker, category, date, duration,
                  youtubeId, thumbUrl, description }    <- archive from the first day
   testimonies  { id, name, title, summary, date, youtubeId }
   ministers    { id, name, role, bio, photoUrl }
   books        { id, title, sub, coverUrl, link }
   live_state   { isLive, title, subject, speaker, youtubeId, description, viewers }
   comments     { id, liveId, author, message, createdAt }   <- live chat
   messages     { id, name, email, phone, message, createdAt } <- contact form
   give_methods { id, label, detail, url }

 API CONTRACT
   getPastor() getServices() getEvents() getLive()
   getVideos({q,sort,category,year,page,pageSize}) -> { items,total,years,categories }
   getVideo(id) getRelatedVideos(id) getTestimonies() getMinisters() getBooks()
   getGiveMethods() getComments(liveId) sendContact(form)
   ChatService.subscribe(cb) / send(author,message) / disconnect()
       -> replace with WebSocket, Supabase Realtime, Firebase or Pusher.

 STYLING  All colours/type are CSS variables in :root. ONE accent colour (--accent).
=====================================================================================
-->
<style>
/* =========================================================
   BRAND TOKENS — change these to rebrand the whole site
   ========================================================= */
:root{
  --accent:#B8935A;          /* the ONE accent colour (brass) */
  --accent-ink:#8A6A38;      /* darker version for text on light surfaces */
  --white:#FFFFFF;
  --paper:#F6F6F5;
  --stone:#E6E6E4;
  --mist:#8B8B88;
  --charcoal:#1E1F21;
  --black:#0C0C0D;

  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;

  --h-hero:clamp(2.6rem,7.2vw + .4rem,6.4rem);
  --h-1:clamp(2.1rem,4.2vw + .5rem,3.9rem);
  --h-2:clamp(1.45rem,1.6vw + 1rem,2.1rem);
  --body:clamp(1rem,.15vw + .96rem,1.125rem);
  --wrap:min(1200px,100% - 2.5rem);
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:var(--body);line-height:1.65;color:var(--charcoal);background:var(--paper);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{width:var(--wrap);margin-inline:auto}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;line-height:1.08}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;line-height:1.1}
h2{font-size:var(--h-1)}
h3{font-size:var(--h-2)}
p{max-width:62ch}
.lede{font-size:clamp(1.08rem,.5vw + 1rem,1.3rem);color:#4a4b4d;line-height:1.6}
.dark .lede{color:#b9b9b6}
section{position:relative}
.pad{padding-block:clamp(4.5rem,10vw,9rem)}
.muted{color:var(--mist)}
body.menu-open,body.lock{overflow:hidden}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.95rem 1.7rem;border-radius:999px;font-weight:500;font-size:.98rem;letter-spacing:.01em;transition:transform .35s var(--ease),background .35s,color .35s,border-color .35s,box-shadow .35s;white-space:nowrap}
.btn-solid{background:var(--white);color:var(--black)}
.btn-solid:hover{transform:translateY(-2px);box-shadow:0 10px 30px -10px rgba(255,255,255,.45)}
.btn-ghost{border:1px solid rgba(255,255,255,.4);color:var(--white)}
.btn-ghost:hover{background:rgba(255,255,255,.1);border-color:#fff}
.btn-dark{background:var(--black);color:#fff}
.btn-dark:hover{transform:translateY(-2px);background:var(--charcoal)}
.btn-line{border:1px solid var(--charcoal);color:var(--charcoal)}
.btn-line:hover{background:var(--charcoal);color:#fff}
.btn-accent{background:var(--accent);color:var(--black)}
.btn-accent:hover{transform:translateY(-2px);box-shadow:0 12px 30px -12px var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:#e5484d;flex:none;box-shadow:0 0 0 0 rgba(229,72,77,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}

/* =========================================================
   HEADER
   ========================================================= */
.hdr{position:fixed;inset:0 0 auto 0;z-index:60;color:#fff;padding-top:env(safe-area-inset-top);transition:background .5s var(--ease),box-shadow .5s}
.hdr-in{width:var(--wrap);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;height:88px;transition:height .5s var(--ease)}
.hdr.scrolled{background:rgba(12,12,13,.68);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 1px 0 rgba(255,255,255,.08)}
.hdr.scrolled .hdr-in{height:64px}
.menu-open .hdr{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.logo{display:flex;align-items:center;gap:.7rem;font-family:var(--serif);letter-spacing:-.01em;min-width:0}
.logo .mark{width:46px;height:46px;flex:none;transition:width .5s var(--ease),height .5s var(--ease)}
.hdr.scrolled .logo .mark{width:40px;height:40px}
.logo b{font-weight:400;font-size:1.08rem;line-height:1.15;max-width:14em}
.nav{display:flex;align-items:center;gap:clamp(.8rem,1.4vw,1.7rem)}
.nav a.l{font-size:.92rem;opacity:.82;position:relative;padding:.3rem 0;transition:opacity .3s;white-space:nowrap}
.nav a.l::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.nav a.l:hover,.nav a.l[aria-current]{opacity:1}
.nav a.l:hover::after,.nav a.l[aria-current]::after{transform:scaleX(1)}
.live-btn{display:inline-flex;align-items:center;gap:.55rem;padding:.55rem 1.15rem;border:1px solid rgba(255,255,255,.35);border-radius:999px;font-size:.9rem;font-weight:500;white-space:nowrap;transition:background .3s,border-color .3s}
.live-btn:hover{background:rgba(255,255,255,.12);border-color:#fff}
.live-btn .dot{width:7px;height:7px}
.burger{display:none;width:44px;height:44px;position:relative;border-radius:50%;flex:none}
.burger span{position:absolute;left:12px;right:12px;height:1.5px;background:#fff;transition:transform .5s var(--ease),top .5s var(--ease)}
.burger span:nth-child(1){top:17px}.burger span:nth-child(2){top:25px}
.menu-open .burger span:nth-child(1){top:21px;transform:rotate(45deg)}
.menu-open .burger span:nth-child(2){top:21px;transform:rotate(-45deg)}
@media (max-width:1260px){.nav{display:none}.burger{display:block}.hdr-in{height:72px}}
@media (max-width:420px){.logo b{font-size:.92rem;max-width:11em}.logo .mark{width:40px;height:40px}}

/* Mobile overlay: sits UNDER the header so the close button stays visible, and scrolls on any screen */
.sheet{position:fixed;inset:0;z-index:50;height:100vh;height:100dvh;background:var(--black);color:#fff;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(88px + env(safe-area-inset-top)) 2rem calc(2rem + env(safe-area-inset-bottom));clip-path:circle(0px at calc(100% - 42px) 44px);visibility:hidden;transition:clip-path .8s var(--ease),visibility 0s .8s}
.menu-open .sheet{clip-path:circle(150vmax at calc(100% - 42px) 44px);visibility:visible;transition:clip-path .9s var(--ease),visibility 0s}
.sheet-in{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.sheet a.m{display:block;font-family:var(--serif);font-size:clamp(1.8rem,7vw,2.8rem);padding:.28rem 0;opacity:0;transform:translateY(22px) scale(.98);transition:opacity .5s var(--ease),transform .6s var(--ease),color .3s}
.sheet a.m:hover,.sheet a.m[aria-current]{color:var(--accent)}
.menu-open .sheet a.m,.menu-open .sheet .sheet-foot{opacity:1;transform:none}
.sheet .sheet-foot{margin-top:2rem;display:flex;gap:.8rem;flex-wrap:wrap;opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease)}

/* =========================================================
   PAGE SHELL, TRANSITIONS, SHIMMER
   ========================================================= */
#app{min-height:70vh;outline:none}
#app.leaving{opacity:0;transform:translateY(8px);transition:opacity .16s,transform .16s}
#app.enter{animation:pageIn .6s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}}
.page-hero{background:var(--black);color:#fff;padding:calc(88px + clamp(3rem,7vw,5.5rem)) 0 clamp(2.5rem,5vw,4.5rem);position:relative;overflow:hidden;isolation:isolate}
.page-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 120% at 85% -20%,rgba(184,147,90,.2),transparent 65%)}
.page-hero h1{font-size:var(--h-1);font-weight:300;max-width:18ch;line-height:1.05}
.page-hero p{margin-top:1.1rem;color:#bdbdb9;max-width:52ch;font-size:clamp(1.05rem,.4vw + 1rem,1.25rem)}
.crumb{display:inline-flex;align-items:center;gap:.4rem;font-size:.9rem;color:#a9a9a5;margin-bottom:1.2rem}
.crumb:hover{color:#fff}
.sk{display:block;border-radius:8px;background:linear-gradient(100deg,#e8e8e5 30%,#f6f6f4 50%,#e8e8e5 70%);background-size:220% 100%;animation:shimmer 1.35s linear infinite}
.sk.d{background:linear-gradient(100deg,#1d1d20 30%,#2b2b2f 50%,#1d1d20 70%);background-size:220% 100%}
@keyframes shimmer{to{background-position:-220% 0}}
.skg{display:grid;gap:1.6rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.sk-card{display:grid;gap:.8rem}
.sk.h1{height:clamp(2.4rem,5vw,3.6rem);width:min(520px,80%)}.sk.t{height:1rem;width:min(420px,70%)}.sk.s{height:.9rem;width:40%}
.sk.img{aspect-ratio:16/10;border-radius:8px}.sk.blk{height:260px;border-radius:10px}

/* =========================================================
   HERO
   ========================================================= */
.hero{min-height:100svh;background:var(--black);color:#fff;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate;position:relative}
.hero-bg{position:absolute;inset:-8% 0;z-index:-2;background:var(--hero-img,none) center/cover no-repeat,radial-gradient(120% 80% at 50% 110%,#2a2620 0%,var(--black) 60%);will-change:transform}
.beam{position:absolute;top:-20%;width:34vmax;height:150%;background:linear-gradient(180deg,rgba(255,243,220,.20),rgba(255,243,220,0) 70%);filter:blur(34px);transform-origin:top center;opacity:.7;z-index:-1;mix-blend-mode:screen}
.beam.b1{left:12%;transform:rotate(14deg);animation:sway 16s ease-in-out infinite alternate}
.beam.b2{left:42%;width:26vmax;transform:rotate(-4deg);opacity:.5;animation:sway 21s ease-in-out -6s infinite alternate}
.beam.b3{right:6%;transform:rotate(-16deg);opacity:.45;animation:sway 18s ease-in-out -3s infinite alternate}
@keyframes sway{to{transform:rotate(calc(var(--r,0deg) + 7deg)) translateX(3vmax)}}
.beam.b1{--r:14deg}.beam.b2{--r:-4deg}.beam.b3{--r:-16deg}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(12,12,13,.55) 0%,rgba(12,12,13,.15) 35%,rgba(12,12,13,.85) 100%)}
.hero-c{padding-block:9rem 5.5rem;width:var(--wrap);margin-inline:auto}
.hero h1{font-size:var(--h-hero);max-width:13ch;line-height:1.02;font-weight:300}
.hero h1 em{font-style:italic;color:#e8dcc6}
.hero p{margin-top:1.6rem;font-size:clamp(1.05rem,.6vw + .95rem,1.35rem);color:#cfcfcb;max-width:48ch}
.hero .ctas{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:2.4rem}
.scroll-cue{position:absolute;right:max(1.25rem,calc((100% - 1200px)/2));bottom:3rem;display:flex;align-items:center;gap:.9rem;font-size:.82rem;color:#bdbdb9;writing-mode:vertical-rl}
.scroll-cue i{display:block;width:1px;height:64px;background:linear-gradient(var(--accent),transparent);animation:drip 2.4s var(--ease) infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
@media (max-width:700px){.scroll-cue{display:none}.hero-c{padding-block:8rem 4rem}}
.js .hero-in{opacity:0;transform:translateY(28px);filter:blur(6px);animation:rise 1.4s var(--ease) forwards}
.js .hero-in:nth-child(1){animation-delay:.2s}.js .hero-in:nth-child(2){animation-delay:.45s}.js .hero-in:nth-child(3){animation-delay:.7s}
@keyframes rise{to{opacity:1;transform:none;filter:none}}

/* =========================================================
   ABOUT / SPLIT
   ========================================================= */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,6rem);align-items:center}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.ph{position:relative;overflow:hidden;border-radius:6px;background:var(--charcoal)}
.ph-in{position:absolute;inset:-10% 0;background:var(--img,none) center/cover no-repeat,linear-gradient(160deg,var(--c1,#3a352c),var(--c2,#17171a) 70%);will-change:transform}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.tall{aspect-ratio:4/5}
.ph .init{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:clamp(2.4rem,5vw,3.4rem);color:rgba(255,255,255,.7)}
.about h2{margin-bottom:1.4rem}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:2.6rem;padding-top:2rem;border-top:1px solid var(--stone)}
.mv h3{font-size:1.25rem;margin-bottom:.4rem}
.mv p{font-size:.98rem;color:#58595b}
@media (max-width:560px){.mv{grid-template-columns:1fr}}
.values{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem}
.values span{padding:.45rem 1rem;border:1px solid var(--stone);border-radius:999px;font-size:.92rem;background:#fff}
.pastor{display:flex;align-items:center;gap:1.1rem;margin-top:2.4rem}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(160deg,#4a4538,#1e1f21);flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--stone)}
.pastor b{display:block;font-family:var(--serif);font-weight:400;font-size:1.2rem}
.pastor small{color:var(--mist);font-size:.9rem}
.prose p+p{margin-top:1.1rem}
.beliefs div{padding:1.4rem 0;border-top:1px solid var(--stone)}
.beliefs div:last-child{border-bottom:1px solid var(--stone)}
.beliefs h3{font-size:1.3rem;margin-bottom:.3rem}
.beliefs p{color:#58595b;font-size:.98rem}

/* =========================================================
   SERVICES
   ========================================================= */
.services{background:#fff}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:2rem;flex-wrap:wrap;margin-bottom:3rem}
.sec-head p{margin-top:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.2rem}
.card{background:var(--paper);border-radius:10px;padding:2rem 1.8rem 1.9rem;border:1px solid transparent;display:flex;flex-direction:column;gap:1.8rem;transition:transform .5s var(--ease),border-color .4s,background .4s}
.card:hover{transform:translateY(-4px);border-color:var(--stone);background:#fff}
.card .when{font-family:var(--serif);font-size:clamp(2.2rem,3vw,2.8rem);line-height:1;letter-spacing:-.02em}
.card .when small{display:block;font-family:var(--sans);font-size:.9rem;letter-spacing:0;color:var(--accent-ink);margin-bottom:.7rem;font-weight:500}
.card h3{font-size:1.25rem}
.card .where{color:var(--mist);font-size:.95rem}
.services .card{background:var(--paper)}
.bg-paper .card{background:#fff;border-color:var(--stone)}

/* =========================================================
   LIVE (dark, as original) + chat
   ========================================================= */
.dark{background:var(--black);color:#fff}
.live{overflow:hidden}
.live::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 80% 0%,rgba(184,147,90,.16),transparent 70%);pointer-events:none}
.live-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:clamp(1.5rem,4vw,4rem);align-items:center}
@media (max-width:900px){.live-grid{grid-template-columns:1fr}}
.player{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#151517;box-shadow:0 40px 90px -40px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5rem;gap:.8rem;background:radial-gradient(80% 90% at 50% 120%,#2b261d,#121214 70%)}
.player .off .ring{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;margin-bottom:.6rem}
.player .off .ring svg{width:22px;margin-left:3px;color:var(--accent)}
.player .off h3{font-size:clamp(1.3rem,2.4vw,1.9rem)}
.player .off p{color:#a9a9a5;font-size:.98rem}
.tag{display:inline-flex;align-items:center;gap:.6rem;font-size:.9rem;font-weight:500;padding:.4rem .9rem;border-radius:999px;background:rgba(255,255,255,.08)}
.live-info h2{margin:1.3rem 0 1rem;font-size:clamp(1.9rem,3vw + .6rem,3rem)}
.live-info .meta{display:grid;gap:.7rem;margin:1.8rem 0 2rem;padding-top:1.4rem;border-top:1px solid rgba(255,255,255,.12);font-size:.98rem;color:#c7c7c3}
.live-info .meta div{display:flex;justify-content:space-between;gap:1rem}
.live-info .meta b{font-weight:500;color:#fff}
/* full live page */
.live-page{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:1.8rem;align-items:start}
@media (max-width:1000px){.live-page{grid-template-columns:1fr}}
.player.pseudo-fs,.player:fullscreen{aspect-ratio:auto;border-radius:0;width:100%;height:100%}
.player:-webkit-full-screen{aspect-ratio:auto;border-radius:0;width:100%;height:100%}
.player.pseudo-fs{position:fixed;inset:0;z-index:200}
.player .ph-in{inset:0;background:radial-gradient(80% 90% at 50% 120%,#2b261d,#121214 70%)}
.player .soon{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1rem;color:#a9a9a5;font-size:.95rem}
.ptag{position:absolute;left:.8rem;top:.8rem;z-index:3;background:rgba(12,12,13,.72);border:1px solid rgba(255,255,255,.14)}
.pctl{position:absolute;right:.8rem;bottom:.8rem;z-index:3}

      exitFs = () => { if (inFs()) exit(); document.body.classList.remove("lock"); };

      const list = $("#msgs", el), count = $("#chatCount", el), name = $("#chatName", el), input = $("#chatMsg", el);
      let n = 0; name.value = store.get("chatName") || "";
      const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return "hsl(" + h + " 32% 36%)"; };
      const add = m => {
        const near = list.scrollHeight - list.scrollTop - list.clientHeight < 90 || m.mine;
        const t = new Date(m.createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const div = document.createElement("div"); div.className = "msg";
        div.innerHTML = `<span class="av" style="background:${hue(m.author)}">${esc(m.author[0].toUpperCase())}</span><div><b>${esc(m.author)}</b><time>${t}</time><p>${esc(m.message)}</p></div>`;
        list.appendChild(div); if (list.children.length > 200) list.firstChild.remove();
        count.textContent = (++n) + " comments"; if (near) list.scrollTop = list.scrollHeight;
      };
      (await API.getComments()).forEach(add);
      ChatService.subscribe(add);
      $("#chatForm", el).addEventListener("submit", async e => {
        e.preventDefault();
        const author = name.value.trim() || "Guest", msg = input.value.trim();
        if (!msg) return input.focus();
        store.set("chatName", author); input.value = ""; await ChatService.send(author, msg); input.focus();
      });
    },
    unmount(){ if (exitFs) exitFs(); handlers.forEach(h => document.removeEventListener(h[0], h[1])); ChatService.disconnect(); } };
};
VIEWS.live.skeleton = "live";

/* ---------- VIDEOS / ARCHIVE ---------- */
const ARCHIVE = { q: "", sort: "newest", category: "", year: "", page: 1, view: store.get("videoView") || "grid" };
VIEWS.videos = async () => {
  const first = await API.getVideos({ ...ARCHIVE, page: 1 });
  const opt = (v, cur, label) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(label || v)}</option>`;
  const since = new Date(DB.videos[0].date + "T12:00:00").getFullYear();
  return { title: "Videos", html: pageHero("Video archive.", "Every service and message since our first service in " + since + ".") + `
    <section class="sermons pad" style="padding-top:clamp(2.5rem,5vw,4rem)"><div class="wrap">
      <div class="toolbar">
        <label class="search" style="font-weight:400"><span style="position:absolute;left:-9999px">Search videos</span>${ICON.search}<input class="fld" id="q" type="search" placeholder="Search by title, subject, speaker or date" value="${esc(ARCHIVE.q)}"></label>
        <select class="fld" id="sort" aria-label="Sort">${opt("newest", ARCHIVE.sort, "Newest first")}${opt("oldest", ARCHIVE.sort, "Oldest first")}${opt("az", ARCHIVE.sort, "Title A to Z")}${opt("za", ARCHIVE.sort, "Title Z to A")}</select>
        <select class="fld" id="cat" aria-label="Category"><option value="">All categories</option>${first.categories.map(c => opt(c, ARCHIVE.category)).join("")}</select>
        <select class="fld" id="year" aria-label="Year"><option value="">All years</option>${first.years.map(y => opt(y, ARCHIVE.year)).join("")}</select>
        <div class="seg" role="group" aria-label="View"><button type="button" data-view="grid" aria-pressed="${ARCHIVE.view === "grid"}" aria-label="Grid view">${ICON.grid}</button><button type="button" data-view="list" aria-pressed="${ARCHIVE.view === "list"}" aria-label="List view">${ICON.list}</button></div>
      </div>
      <div class="count" id="count"></div>
      <div id="results"></div>
      <div class="more"><button class="btn btn-line" id="more" type="button">Load more</button></div>
    </div></section>`,
    mount(el){
      const results = $("#results", el), count = $("#count", el), more = $("#more", el); let timer;
      const run = async reset => {
        if (reset) ARCHIVE.page = 1;
        const r = await API.getVideos(ARCHIVE, { silent: true });
        count.textContent = r.total + " video" + (r.total === 1 ? "" : "s");
        results.className = ARCHIVE.view === "grid" ? "sgrid" : "vlist";
        results.innerHTML = r.items.length ? r.items.map(videoCard).join("") : `<div class="empty">No videos match your search. Try a different word, year, or category.</div>`;
        more.parentElement.style.display = r.items.length < r.total ? "" : "none";
        $$(".rv", results).forEach(x => x.classList.add("in"));
      };
      $("#q", el).addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => { ARCHIVE.q = e.target.value; run(true); }, 160); });
      $("#sort", el).addEventListener("change", e => { ARCHIVE.sort = e.target.value; run(true); });
      $("#cat", el).addEventListener("change", e => { ARCHIVE.category = e.target.value; run(true); });
      $("#year", el).addEventListener("change", e => { ARCHIVE.year = e.target.value; run(true); });
      $$(".seg button", el).forEach(b => b.addEventListener("click", () => {
        ARCHIVE.view = b.dataset.view; store.set("videoView", ARCHIVE.view);
        $$(".seg button", el).forEach(x => x.setAttribute("aria-pressed", String(x === b))); run(false);
      }));
      more.addEventListener("click", () => { ARCHIVE.page++; run(false); });
      run(false);
    } };
};

VIEWS.contact = async () => ({ title: "Contact", html: pageHero("Plan your visit.", "Tell us you are coming and someone will be ready to welcome you.") + `
  <section class="contact pad"><div class="wrap split" style="align-items:start">
    <div>
      <h2 class="rv">We would love to hear from you.</h2>
      <div class="cinfo rv" style="--d:.1s"><div><b>Address</b><span>${esc(SITE.address)}</span></div><div><b>Phone</b><span>${esc(SITE.phone)}</span></div><div><b>Email</b><span>${esc(SITE.email)}</span></div></div>
    </div>
    <form id="cf" class="rv" style="--d:.1s" novalidate>
      <label>Your name<input name="name" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>

  mount(el){

      ok.textContent = "Thank you. We will be in touch soon."; f.reset();
    });
  } });

/* =====================================================================================
   7. ROUTER — keeps the path in memory (works even where URL changes are blocked)
   ===================================================================================== */
const ROUTES = [
  { re: /^\/?$/, view: "home", nav: "home" },
  { re: /^\/about$/, view: "about", nav: "about" },
  { re: /^\/programs$/, view: "programs", nav: "programs" },
  { re: /^\/live$/, view: "live", nav: "live" },
  { re: /^\/videos$/, view: "videos", nav: "videos" },
  { re: /^\/video\/(\d+)$/, view: "video", nav: "videos", params: ["id"] },
  { re: /^\/testimonies$/, view: "testimonies", nav: "testimonies" },
  { re: /^\/ministers$/, view: "ministers", nav: "ministers" },
  { re: /^\/books$/, view: "books", nav: "books" },
  { re: /^\/give$/, view: "give", nav: "give" },
  { re: /^\/contact$/, view: "contact", nav: "contact" }
];
const NAV = [["home","Home","#/"],["about","About","#/about"],["programs","Programs","#/programs"],["videos","Videos","#/videos"],["testimonies","Testimonies","#/testimonies"],["ministers","Ministers","#/ministers"],["books","Books","#/books"],["give","Give","#/give"],["contact","Contact","#/contact"]];
const app = $("#app");
let memPath = "/", navToken = 0, current = null, io = null, parEls = [], heroBg = null;

function hashPath(){ try { const h = location.hash; return h.indexOf("#/") === 0 ? h.slice(1) : null; } catch (e) { return null; } }
function go(path){
  if (path === memPath && current) { window.scrollTo(0, 0); return; }
  memPath = path;
  try { location.hash = "#" + path; } catch (e) {}   // mirror to URL when allowed; ignored in sandboxed previews
  navigate();
}
function matchRoute(){
  const parts = memPath.split("?"), path = parts[0];
  ROUTE_QUERY = new URLSearchParams(parts[1] || "");
  for (const r of ROUTES) { const m = path.match(r.re); if (m) { const params = {}; (r.params || []).forEach((k, i) => params[k] = m[i + 1]); return { r, params }; } }
  return { r: { view: null, nav: "" }, params: {} };
}
function setActive(key){ $$("[data-nav]").forEach(a => a.dataset.nav === key ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")); }
function reveal(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .1, rootMargin: "0px 0px -5% 0px" });
  $$(".rv:not(.in)", app).forEach(el => io.observe(el));
}
async function navigate(){
  const token = ++navToken, route = matchRoute(), r = route.r;
  setMenu(false);
  if (current && current.unmount) { try { current.unmount(); } catch (e) {} }
  current = null; parEls = []; heroBg = null;
  app.classList.remove("enter"); app.classList.add("leaving");
  await sleep(reduceMotion ? 0 : 160);
  if (token !== navToken) return;
  setActive(r.nav); window.scrollTo(0, 0);
  app.classList.remove("leaving");
  const viewFn = r.view && VIEWS[r.view];
  if (!viewFn) { app.innerHTML = pageHero("Page not found.", "That page does not exist. Use the menu to find what you need."); app.classList.add("enter"); return; }
  app.innerHTML = SKELETON[viewFn.skeleton || "cards"]();      // shimmer while loading
  app.classList.add("enter");
  let view;
  try { view = await viewFn(route.params); }
  catch (err) { console.error(err); view = { title: "Error", html: pageHero("Something went wrong.", "Please refresh the page or try again in a moment.") }; }
  if (token !== navToken) return;
  document.title = (view.title && view.title !== "Home" ? view.title + " | " : "") + SITE.name;
  app.classList.remove("enter"); void app.offsetWidth;
  app.innerHTML = view.html; app.classList.add("enter");
  current = view;
  parEls = $$("[data-par]", app); heroBg = $("#heroBg", app);
  if (view.mount) { try { await view.mount(app); } catch (e) { console.error(e); } }
  reveal(); onScroll();
}
window.addEventListener("hashchange", () => { const p = hashPath(); if (p !== null && p !== memPath) { memPath = p; navigate(); } });
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  e.preventDefault(); go(a.getAttribute("href").slice(1));
});

/* =====================================================================================
   8. SHELL — header, menu, footer, dialog, scroll effects
   ===================================================================================== */
$$("[data-name]").forEach(e => e.textContent = SITE.name);
$$("[data-short]").forEach(e => e.textContent = SITE.short);
$$("[data-logo]").forEach(e => e.outerHTML = logo());
$("#yr").textContent = new Date().getFullYear();
$("#nav").innerHTML = NAV.map(n => `<a class="l" data-nav="${n[0]}" href="${n[2]}">${n[1]}</a>`).join("") + `<a class="live-btn" data-nav="live" href="#/live"><span class="dot"></span>Watch Live</a>`;
$("#sheetIn").innerHTML = NAV.slice(0, 4).concat([["live", "Live", "#/live"]], NAV.slice(4)).map((n, i) => `<a class="m" data-nav="${n[0]}" href="${n[2]}" style="transition-delay:${.1 + i * .045}s">${n[1]}</a>`).join("")
  + `<div class="sheet-foot" style="transition-delay:.6s"><a class="btn btn-accent" href="#/live"><span class="dot"></span>Watch Live</a><a class="btn btn-ghost" href="#/give">Give</a></div>`;
$("#footLinks").innerHTML = NAV.map(n => `<a href="${n[2]}">${n[1]}</a>`).join("") + `<a href="#/live">Live</a>`;

const burger = $("#burger"), sheet = $("#sheet"), hdr = $("#hdr");
function setMenu(open){
  document.body.classList.toggle("menu-open", open);
  burger.setAttribute("aria-expanded", String(open)); burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  sheet.setAttribute("aria-hidden", String(!open)); if (open) sheet.scrollTop = 0;
}
burger.addEventListener("click", () => setMenu(!document.body.classList.contains("menu-open")));
addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
addEventListener("resize", () => { if (innerWidth > 1260) setMenu(false); });

let ticking = false;
function onScroll(){
  const y = scrollY;
  hdr.classList.toggle("scrolled", y > 40);
  if (!reduceMotion) {
    if (heroBg && y < innerHeight * 1.2) heroBg.style.transform = "translate3d(0," + (y * .22) + "px,0)";
    parEls.forEach(el => {
      const box = el.parentElement.getBoundingClientRect();
      if (box.bottom < 0 || box.top > innerHeight) return;
      el.style.transform = "translate3d(0," + ((box.top + box.height / 2 - innerHeight / 2) * parseFloat(el.dataset.par)).toFixed(1) + "px,0)";
    });
  }
  ticking = false;
}
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });

const dlg = $("#dlg");
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-testimony]"); if (!b) return;
  const t = DB.testimonies.find(x => x.id === Number(b.dataset.testimony)); if (!t) return;
  dlg.innerHTML = `<button class="dlg-x" type="button" aria-label="Close" id="dlgX">${ICON.close}</button>
    <div class="player" style="border-radius:0">${player(t, t.title)}</div>
    <div class="dlg-b"><h3>${esc(t.title)}</h3><p class="muted" style="margin-bottom:.8rem">${esc(t.name)} &nbsp;|&nbsp; ${fmtDate(t.date)}</p><p>${esc(t.summary)}</p></div>`;
  if (dlg.showModal) { dlg.showModal(); document.body.classList.add("lock"); }
});
dlg.addEventListener("click", e => { if (e.target === dlg || (e.target.closest && e.target.closest("#dlgX"))) dlg.close(); });
dlg.addEventListener("close", () => { dlg.innerHTML = ""; document.body.classList.remove("lock"); });

/* Start */
memPath = hashPath() || "/";
navigate();
</script>
